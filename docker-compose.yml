services:
  postgres:
    image: postgres:15-alpine
    container_name: cana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evolution}
      POSTGRES_USER: ${POSTGRES_USER:-evolution}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-my_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evolution} -d ${POSTGRES_DB:-evolution}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: cana-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  java-api:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: cana-java-api
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-evolution}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-evolution}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-my_password}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-cana_internal_local_change_me}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:-cana-dev-admin-token-secret-change-before-production-2026}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  python-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cana-python-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JAVA_API_URL: http://java-api:8081
      EVOLUTION_API_URL: http://evolution-api:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-cana_internal_local_change_me}
    depends_on:
      java-api:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.0
    container_name: cana-evolution-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-cana_evolution_local_change_me}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-evolution}:${POSTGRES_PASSWORD:-my_password}@postgres:5432/${POSTGRES_DB:-evolution}?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_db
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: cana
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CONFIG_SESSION_PHONE_CLIENT: CANA
      CONFIG_SESSION_PHONE_NAME: Chrome

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
