server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: cana-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/evolution}
    username: ${SPRING_DATASOURCE_USERNAME:evolution}
    password: ${SPRING_DATASOURCE_PASSWORD:cana_local_dev_change_me}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

cana:
  security:
    internal-token: ${INTERNAL_API_TOKEN:}
    admin-token-secret: ${ADMIN_TOKEN_SECRET:cana-dev-admin-token-secret-change-before-production-2026}
